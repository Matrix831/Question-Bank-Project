<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mock Exam Generator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; display: flex; justify-content: center; }
        .container { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; width: 100%; max-width: 500px; }
        h2 { color: #58a6ff; font-weight: 300; border-bottom: 1px solid #30363d; padding-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-size: 14px; color: #8b949e; }
        
        select, input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; box-sizing: border-box; font-size: 16px; }

        /* Mobile-Friendly Checkbox List */
        .checkbox-list {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #1c2128;
            cursor: pointer;
            transition: 0.2s;
        }

        .checkbox-item:last-child { border-bottom: none; }
        .checkbox-item:hover { background: #1c2128; }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #58a6ff;
        }

        .checkbox-item span { font-size: 15px; }

        .btn-gen { background: #238636; color: white; padding: 15px; border: none; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 10px; }
        .btn-gen:hover { background: #2ea043; }
        
        .back-link { display: block; text-align: center; margin-top: 25px; color: #8b949e; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h2>⚡ Mock Exam Generator</h2>
    
    <div class="form-group">
        <label>1. Select Subject</label>
        <select id="subject-sel" onchange="loadSubtopics()">
            <option value="">-- Choose Subject --</option>
            {% for s in subjects %}
            <option value="{{ s }}">{{ s }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>2. Select Subtopics</label>
        <div id="subtopic-container" class="checkbox-list">
            <p style="color: #444; text-align: center; font-size: 13px;">Select a subject first...</p>
        </div>
    </div>

    <div class="form-group">
        <label>3. Number of Questions</label>
        <input type="number" id="q-count" value="10" min="1" max="100">
    </div>

    <button class="btn-gen" onclick="createExam()">GENERATE PRINTABLE PDF</button>
    <a href="/" class="back-link">← Return to Portal</a>
</div>

<script>
    function loadSubtopics() {
        const sub = document.getElementById('subject-sel').value;
        const container = document.getElementById('subtopic-container');
        
        if (!sub) {
            container.innerHTML = '<p style="color: #444; text-align: center; font-size: 13px;">Select a subject first...</p>';
            return;
        }

        fetch('/get_subtopics/' + encodeURIComponent(sub))
            .then(res => res.json())
            .then(data => {
                container.innerHTML = ''; // Clear existing
                data.forEach(t => {
                    // Create checkbox item structure
                    const div = document.createElement('label');
                    div.className = 'checkbox-item';
                    div.innerHTML = `
                        <input type="checkbox" name="subtopic" value="${t}">
                        <span>${t}</span>
                    `;
                    container.appendChild(div);
                });
            });
    }

    function createExam() {
        const sub = document.getElementById('subject-sel').value;
        // Collect values from all checked boxes
        const checkedBoxes = document.querySelectorAll('input[name="subtopic"]:checked');
        const selected = Array.from(checkedBoxes).map(cb => cb.value);
        const count = document.getElementById('q-count').value;

        if(!sub || selected.length === 0) {
            alert("Select a subject and at least one subtopic, bro!");
            return;
        }

        // Send to existing custom route
        window.open(`/mock_exam_custom/${encodeURIComponent(sub)}/${encodeURIComponent(JSON.stringify(selected))}/${count}`, '_blank');
    }
</script>
</body>
</html>
