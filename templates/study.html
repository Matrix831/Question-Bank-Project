<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solving Mode</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: { enableMenu: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body { 
            background: #050505; color: white; font-family: 'Segoe UI', sans-serif;
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
        }
        .main-content { text-align: center; width: 80%; max-width: 1000px; transition: 0.3s; }
        
        #q-text { font-size: 2.5rem; font-weight: 300; margin-bottom: 50px; color: #f0f0f0; line-height: 1.4; }
        
        #answer-box { display: none; background: #111; padding: 30px; border-radius: 12px; border: 1px solid #222; margin-top: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        #a-text { font-size: 2rem; color: #4caf50; margin: 0; font-weight: bold; }
        #s-text { font-size: 1.2rem; color: #888; margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }

        .btn-reveal { background: transparent; border: 1px solid #444; color: #666; padding: 15px 30px; cursor: pointer; border-radius: 8px; font-size: 14px; letter-spacing: 1px; }
        .btn-reveal:hover { border-color: #007bff; color: white; }

        .btn-next { 
            position: absolute; bottom: 40px; right: 40px; 
            background: #007bff; color: white; border: none; 
            padding: 15px 45px; font-size: 1.1rem; border-radius: 50px; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,123,255,0.3); transition: 0.2s;
        }
        .btn-next:hover { background: #0056b3; transform: scale(1.05); }
        .btn-exit { position: absolute; top: 30px; left: 30px; color: #444; text-decoration: none; font-size: 14px; }
        .hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #333; font-size: 12px; }
        
        .stats-bar {
             position: absolute; top: 20px; right: 30px;
             display: flex; gap: 20px; font-family: monospace;
             color: #58a6ff; font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="stats-bar">
        <div id="timer">00:00</div>
        <div id="counter">Q #1</div>
    </div>

    <a href="/" class="btn-exit">[ESC] EXIT TO PORTAL</a>

    <div class="main-content">
        <div id="q-text">Preparing challenge...</div>
        
        <button id="show-btn" class="btn-reveal" onclick="showAnswer()">PRESS [SPACE] TO REVEAL ANSWER</button>
        
        <div id="answer-box">
            <h2 id="a-text"></h2>
            <div id="s-text"></div>
        </div>
    </div>

    <button class="btn-next" onclick="loadNext()">NEXT [→]</button>
    <div class="hint">Use Spacebar to reveal • Right Arrow for next</div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const sub = pathParts[2];
        const topic = pathParts[3];

        let seconds = 0;
        let qCount = 0; // Set to 0 so the first loadNext() makes it #1

        // Timer Logic
        setInterval(() => {
            seconds++;
            let mins = Math.floor(seconds / 60);
            let secs = seconds % 60;
            document.getElementById('timer').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }, 1000);

        function loadNext() {
            // Update UI State
            document.getElementById('answer-box').style.display = 'none';
            document.getElementById('show-btn').style.display = 'inline-block';
            document.getElementById('q-text').innerText = "Loading...";
            
            // Update Question Counter
            qCount++;
            document.getElementById('counter').innerText = `Q #${qCount}`;

            fetch(`/get_question/${sub}/${topic}`)
                .then(res => res.json())
                .then(data => {
                    if(data.error) {
                        document.getElementById('q-text').innerText = data.error;
                    } else {
                        document.getElementById('q-text').innerHTML = data.question;
                        document.getElementById('a-text').innerHTML = data.answer;
                        document.getElementById('s-text').innerHTML = "<b>Step-by-Step:</b><br>" + data.solution;
                        
                        if (window.MathJax) {
                            MathJax.typesetPromise();
                        }
                    }
                });
        }

        function showAnswer() {
            document.getElementById('answer-box').style.display = 'block';
            document.getElementById('show-btn').style.display = 'none';
            if (window.MathJax) MathJax.typesetPromise();
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                showAnswer();
            } else if (e.code === "ArrowRight") {
                loadNext();
            } else if (e.code === "Escape") {
                window.location.href = "/";
            }
        });

        loadNext();
    </script>
</body>
</html>
